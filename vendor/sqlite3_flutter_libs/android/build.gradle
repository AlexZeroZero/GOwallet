group 'eu.simonbinder.sqlite3_flutter_libs'
version '1.0'

buildscript {
    repositories {
        mavenLocal()
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.0.1'
    }
}

apply plugin: 'com.android.library'

android {
    compileSdkVersion 32
    ndkVersion '28.0.13004108'
    externalNativeBuild {
        cmake { path 'cpp/CMakeLists.txt' }
    }

    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'eu.simonbinder.sqlite3_flutter_libs'
    }

    defaultConfig {
        minSdkVersion 24
        externalNativeBuild {
            cmake { arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' }
        }
    }
    lintOptions {
        disable 'InvalidPackage'
    }
}

// Same SQLite source/version/options as 3.46.1+1, rebuilt with NDK hardening.
